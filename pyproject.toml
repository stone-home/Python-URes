[tool.poetry]
name = "ures"
version = "0.1.0"
description = "Utility library for research and development: Docker workflows, Markdown and Zettelkasten, data structures, and core file/network/string/time helpers."
authors = ["stone <github@stone-bo.com>"]
license = "MIT"
readme = "docs/index.md"
homepage = "https://stone-home.github.io/Python-URes/"
documentation = "https://stone-home.github.io/Python-URes/"
repository = "https://github.com/stone-home/Python-URes"
keywords = [
    "utilization",
    "Research Tool",
    "Python"
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
packages = [
    { include = "ures"},
]
exclude = [
    "tests",
    "docs",
    "examples",
    "dist",
    "build",
    "ures.egg-info",
    ".git",
    ".gitignore",
    ".github",
    ".pre-commit-config.yaml",
    "commitlint.config.js",
    "run_ut.sh",
    ".env"
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
python-frontmatter = "^1.3.0"
docker = "^7.2.0"
pydantic = "^2.13.5"
tqdm = "^4.70.1"
sortedcontainers = "^2.4.0"
onepassword-sdk = "^0.4.1"
pyperclip = "^1.9.0"
requests = "^2.34.2"
beautifulsoup4 = "^4.15.0"
bibtexparser = "^2.0.1"
unidecode = "^1.4.0"
pycountry = "^26.2.16"


[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
mkdocs = "^1.6.1"
mkdocstrings-python = "^2.0.8"
mkdocs-material = "^9.7.7"
pre-commit = "^4.6.2"
pytest-time = "^0.5.0"
pytest-xdist = "^3.8.0"
coverage = "^7.16.1"
rich = "^15.0.0"

[tool.poetry.scripts]
ures-bib = "ures.literature.citation.bib_cli:main"




[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# pyproject.toml
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cache-clear"
testpaths = [
    "tests",
]
