# Change Approval

Applies to every change an agent makes to files: code, configuration, documentation, notes, and data, in any project. Writes to the project's temporary directory (`ProjectPaths.temporary`, default `ai-tmp/`) are exempt. This rule decides when a change needs the user's approval and how to ask; it does not decide whether the change is right.

## Size gate

- Count the non-blank lines added, modified, or deleted, summed over every file and every agent in the task. Files regenerated by project tooling and pure moves or renames are listed but not counted.
- Over 10 lines: change no file. Send the approval proposal and wait for the user's decision. Read-only investigation may continue.
- 10 lines or fewer: proceed. When unsure of the size, treat it as over.
- A request to do the work is not approval. Approval is the user's explicit reply to the proposal and covers only the proposed scope; new files or folders, or clearly more lines, need a new proposal.
- The user may waive the gate for a named task in so many words; the waiver ends with that task.

## Approval proposal

Write it in the user's language, each part on its own line so Markdown does not merge them:

- **Brief:** one plain sentence on what the change mainly addresses.
- **Approach:** the thinking behind the design, such as smallest change, fix the root cause, or reuse an existing pattern.
- **Scope:** one bullet per affected file or folder, saying why it changes in everyday words, not technical detail.

End by asking the user to approve or adjust.

## Delegated agents

- When the work is split across agents and passes the size gate, the proposal also names each agent's responsibility and its files or folders. Dispatch only after approval.
- Each agent writes only inside its approved scope and receives this rule with its task.
- An agent that needs more scope does not write it in the shared working tree:
  - File changes go in a separate git worktree. The main agent shows the result to the user and merges only after approval.
  - Data only, such as intermediate results, goes in the project's temporary directory, which stays out of version control.

# Skills-hub rules

Read a listed rule file before the work its description covers.

- `.skills-hub/plugins/highest-court/rules/highest-court-exploration-discussion.mdc`: Use for philosophy, open-ended discussion, brainstorming and thought experiments. Factual claims within the discussion still use Factual Evidence; speculation alone does not trigger research-code requirements.
- `.skills-hub/plugins/highest-court/rules/highest-court-facts-verification.mdc`: Use for factual answers, claim verification, data or paper analysis, quotations and current information. Apply only to factual portions of speculative or creative tasks.
- `.skills-hub/plugins/highest-court/rules/highest-court-path-placement.mdc`: Use when creating, moving, or choosing a path for code, tests, docs, experiments, runs, artifacts, notes, or temporary scripts. Do not use for conversation that does not place files, and do not use it to choose plot colors, fonts, or export mechanics.
- `.skills-hub/plugins/highest-court/rules/highest-court-project-work.mdc`: Use for substantive answers, proposals or changes about an identified project. Do not trigger brief creation for generic questions, casual chat or unrelated brainstorming.
- `.skills-hub/plugins/highest-court/rules/highest-court-research-methods.mdc`: Use when designing, assessing or implementing research methods, hypotheses or experiments. Ordinary software changes and bug fixes do not require a new scientific foundation.
